name: Build Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows setup
        run: pnpm run build:win
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            (Get-Item "dist/RFL-APP-Setup-*.exe").FullName,
            (Get-Item "dist/*.exe.blockmap").FullName,
            (Get-Item "dist/latest.yml").FullName
          )
          gh release create $tag @assets --title "RFL-APP $tag" --notes "Windows-Installationsprogramm für RFL-APP."