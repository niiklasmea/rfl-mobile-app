name: Deploy RFL-APP to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get the source files
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate app news from published changes
        run: node scripts/generate-news.cjs
      - name: Check startup and app news behavior
        run: node --test tests/*.test.cjs
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the app
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish the app
        id: deployment
        uses: actions/deploy-pages@v4
